<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Wrench & Gear</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brand: { 900: '#0f172a', 600: '#4f46e5', 500: '#6366f1' } } } }
        }
    </script>
</head>
<body class="bg-brand-900 text-slate-800 font-sans antialiased flex flex-col min-h-screen">
    
    <div id="toast-container"></div>

    <main class="flex-grow flex items-center justify-center py-12">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full mx-4 border border-slate-100">
            <div class="text-center mb-10">
                <a href="index.html" class="inline-flex bg-red-100 text-red-600 p-3 rounded-full mb-4">
                    <i class="fa-solid fa-shield-halved text-3xl"></i>
                </a>
                <h2 class="text-3xl font-bold text-slate-900 mt-3">Staff / Admin Login</h2>
                <p class="text-slate-500 mt-2">Access the scheduling and repair management system.</p>
            </div>
            
            <form onsubmit="app.handleAdminLogin(event)" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="email" value="admin@wrench.com" required 
                           class="w-full rounded-lg border-slate-300 border p-3 focus:ring-2 focus:ring-brand-500 outline-none transition">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" value="adminpass" required 
                           class="w-full rounded-lg border-slate-300 border p-3 focus:ring-2 focus:ring-brand-500 outline-none transition">
                </div>
                <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 transition shadow-lg">
                    Sign In as Admin
                </button>
            </form>
            
            <div class="mt-8 text-center">
                <p class="mt-4 text-xs text-slate-400">Demo Credentials: admin@wrench.com / adminpass</p>
            </div>
        </div>
    </main>

    <!-- Global JavaScript Logic -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
