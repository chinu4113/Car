<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – CarCare</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .fade-in {
      animation: fade 0.6s ease-in-out;
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-gray-100">

<!-- Background section using online image -->
<div class="min-h-screen flex items-center justify-center bg-cover bg-center"
     style="background-image: url('https://images.unsplash.com/photo-1570129476815-ba368ac77013?auto=format&fit=crop&w=1500&q=80');">

  <!-- Card -->
  <div class="bg-white shadow-2xl rounded-2xl p-8 w-96 fade-in backdrop-blur-sm bg-white/90">

    <!-- Logo (online PNG) -->
    <div class="flex justify-center mb-4">
      <img src="https://png.pngtree.com/png-clipart/20200727/original/pngtree-modern-car-repair-logo-design-png-image_5366858.jpg"
           alt="CarCare Logo" class="h-14 w-auto rounded">
    </div>

    <h2 class="text-2xl font-bold text-center mb-3 text-gray-800">
      Create Your Account
    </h2>
    <p class="text-center text-gray-600 mb-6 text-sm">
      Join CarCare to manage bookings easily.
    </p>

    <!-- Form -->
    <input id="reg-name" type="text" placeholder="Full Name"
           class="w-full border p-2 rounded-lg mb-3 focus:ring-2 focus:ring-blue-500">

    <input id="reg-email" type="email" placeholder="Email Address"
           class="w-full border p-2 rounded-lg mb-3 focus:ring-2 focus:ring-blue-500">

    <input id="reg-pass" type="password" placeholder="Password"
           class="w-full border p-2 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500">

    <button onclick="registerUser()"
            class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
      Create Account
    </button>

    <p class="text-center mt-4 text-sm">
      Already have an account?
      <a href="login.html" class="text-blue-600 font-medium hover:underline">Login</a>
    </p>

  </div>
</div>

<script src="js/auth.js"></script>

</body>
</html>
